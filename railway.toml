[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "app.py",
  "src/**",
  "scripts/**",
  "templates/**",
  "static/**",
  "data/landing/legal/**",
  "data/standardized/legal/**",
  "requirements.render.txt",
  "Dockerfile",
  "start.sh",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
